# Render blueprint for the Site Builder.
# One small web service + a 1 GB disk for client info, built sites and the stock-photo cache.
# Landon creates the service, picks the plan and enters billing himself.
services:
  - type: web
    name: site-builder
    runtime: python
    plan: starter            # needed for the persistent disk
    region: virginia
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /healthz
    disk:
      name: site-builder-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DATA_DIR
        value: /var/data
      - key: BUILDER_PASSWORD   # the login password; the app refuses to run without it
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: PIXABAY_API_KEY
        sync: false
